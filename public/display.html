<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THORIQ POS Display</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'VT323', monospace; }
body { width: 100vw; height: 100vh; overflow: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; }
#displayContent { width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 40px; text-align: center; }
.store-name { font-size: 72px; font-weight: bold; margin-bottom: 30px; text-shadow: 4px 4px 8px rgba(0,0,0,0.5); }
.clock { font-size: 120px; font-weight: bold; margin: 20px 0; text-shadow: 4px 4px 8px rgba(0,0,0,0.5); }
.date { font-size: 36px; margin-bottom: 40px; opacity: 0.8; }
.slide-container { width: 100%; max-width: 1200px; min-height: 200px; display: flex; justify-content: center; align-items: center; }
.slide { font-size: 64px; font-weight: bold; animation: fadeInOut 5s ease-in-out; text-shadow: 3px 3px 6px rgba(0,0,0,0.5); }
@keyframes fadeInOut { 0% { opacity: 0; transform: scale(0.9); } 10% { opacity: 1; transform: scale(1); } 90% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1.1); } }
.footer { position: absolute; bottom: 20px; font-size: 20px; opacity: 0.6; }
.fullscreen-btn { position: absolute; top: 20px; right: 20px; background: rgba(255,255,255,0.2); border: 2px solid white; color: white; padding: 10px 20px; cursor: pointer; font-size: 20px; font-family: 'VT323', monospace; }
.fullscreen-btn:hover { background: rgba(255,255,255,0.4); }
</style>
</head>
<body>
<button class="fullscreen-btn" onclick="toggleFullscreen()">⛶ FULLSCREEN</button>
<div id="displayContent">
<div class="store-name" id="storeName">THORIQ POS</div>
<div class="clock" id="clock">00:00:00</div>
<div class="date" id="date">Loading...</div>
<div class="slide-container">
<div class="slide" id="slideText">SELAMAT DATANG</div>
</div>
</div>
<div class="footer">THORIQ POS v7.0 | Developed by Muhamad Thorik</div>

<script>
const SERVER_URL = window.location.origin;
const socket = io(SERVER_URL);
let displaySettings = {};
let currentSlideIndex = 0;
let slideInterval;

socket.on('connect', () => { console.log('Display connected'); });
socket.on('display_updated', (newSettings) => {
displaySettings = newSettings;
applyDisplaySettings();
});

function applyDisplaySettings() {
document.body.style.backgroundColor = displaySettings.backgroundColor || '#0000AA';
document.body.style.color = displaySettings.textColor || '#FFFFFF';
document.getElementById('storeName').style.display = displaySettings.showStoreName ? 'block' : 'none';
document.getElementById('clock').style.display = displaySettings.showClock ? 'block' : 'none';
document.getElementById('date').style.display = displaySettings.showClock ? 'block' : 'none';
startSlideShow();
}

function updateClock() {
const now = new Date();
document.getElementById('clock').innerText = now.toLocaleTimeString('id-ID');
document.getElementById('date').innerText = now.toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
}

function startSlideShow() {
if (slideInterval) clearInterval(slideInterval);
const allSlides = [
...(displaySettings.announcements || []).map(a => ({ text: a.text, color: a.color, duration: a.duration })),
...(displaySettings.todayDiscounts || []).map(d => ({ text: d.text, color: d.color, duration: d.duration })),
...(displaySettings.rewards || []).map(r => ({ text: r.text, color: r.color, duration: r.duration }))
];
if (allSlides.length === 0) {
document.getElementById('slideText').innerText = 'SELAMAT DATANG';
document.getElementById('slideText').style.color = displaySettings.textColor || '#FFFFFF';
return;
}
currentSlideIndex = 0;
showSlide(allSlides[0]);
slideInterval = setInterval(() => {
currentSlideIndex = (currentSlideIndex + 1) % allSlides.length;
showSlide(allSlides[currentSlideIndex]);
}, displaySettings.slideInterval || 5000);
}

function showSlide(slide) {
const slideEl = document.getElementById('slideText');
slideEl.style.animation = 'none';
setTimeout(() => {
slideEl.innerText = slide.text;
slideEl.style.color = slide.color || displaySettings.textColor || '#FFFFFF';
slideEl.style.animation = 'fadeInOut ' + (displaySettings.slideInterval / 1000 || 5) + 's ease-in-out';
}, 50);
}

function toggleFullscreen() {
if (!document.fullscreenElement) {
document.documentElement.requestFullscreen().catch(err => console.log(err));
} else {
document.exitFullscreen();
}
}

setInterval(updateClock, 1000);
updateClock();

fetch(`${SERVER_URL}/api/display`)
.then(res => res.json())
.then(data => { displaySettings = data; applyDisplaySettings(); })
.catch(err => console.log('Display settings load error:', err));
</script>
</body>
</html>
